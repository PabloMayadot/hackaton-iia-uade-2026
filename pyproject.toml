[project]
name = "t20-last-mile-risk-engine"
version = "0.1.0"
description = "Cost-Sensitive Rule Engine for last-mile delivery absence prediction (Hackatón IIA UADE 2026)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "ruff>=0.8.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
    "ARG",
    "SIM",
    "S",
    "PTH",
    "RUF",
]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"evaluate.py" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["evaluate.py"]
addopts = "-ra -q --strict-markers"
